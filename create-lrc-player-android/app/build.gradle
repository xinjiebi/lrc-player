// Demo 宿主：演示 LrcPlayerView 的接入选歌(SAF)→拷贝到缓存→加载播放
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lrcplayer.demo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lrcplayer.demo'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':lrcplayer')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
