<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部件双语对照表</title>
<style>
:root{--bg:#0d0d12;--card:#17171f;--line:#262633;--fg:#e8e8ef;--sub:#9a9ab0;--accent:#4da3ff;--accent2:#16f4d4;--chip:#22222e}
@media (prefers-color-scheme: light){:root{--bg:#f6f6fa;--card:#fff;--line:#e2e2ec;--fg:#1a1a24;--sub:#66667e;--chip:#ececf4}}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"PingFang SC",sans-serif;margin:0;padding:0 16px 60px}
h1{font-size:20px;margin:22px 0 4px}
p.sub{color:var(--sub);font-size:13px;margin:0 0 16px;line-height:1.7}
#bar{position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#q{flex:1;min-width:160px;font:inherit;font-size:14px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.mf{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.mf.on{background:var(--accent);border-color:var(--accent);color:#fff}
h2{font-size:15px;margin:26px 0 4px;display:flex;align-items:baseline;gap:8px}
h2 .en{color:var(--sub);font-size:12px;font-weight:400}
h2 .cnt{color:var(--sub);font-size:11px;font-weight:400}
.gd{color:var(--sub);font-size:12px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;text-align:left;color:var(--sub);font-weight:500;font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--card)}
td.k{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent2);white-space:nowrap}
td .jp{color:var(--sub);font-size:12px}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--sub);margin-right:3px}
.w{color:var(--sub);font-size:12px;font-family:ui-monospace,monospace}
mark{background:transparent;color:inherit}
.hide{display:none}
.note{margin-top:30px;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:12.5px;color:var(--sub);line-height:1.8}
code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent2)}
</style>
</head>

<h1>JIZURA 表现部件 · 中英（日）对照表</h1>
<p class="sub">860 个预制表现部件，按 10 组注册。风格包通过 bias 权重字典引用「关键词(key)」——数字是概率倍率（&gt;1 偏好，&lt;1 抑制）。心情标签决定部件与 mood 的匹配度。</p>
<div id="bar">
  <input id="q" placeholder="搜索关键词 / 中文 / 日文…">
  <button class="mf on" data-m="">全部</button>
  <button class="mf" data-m="glitch">故障</button>
  <button class="mf" data-m="calm">静谧</button>
  <button class="mf" data-m="pop">流行</button>
  <button class="mf" data-m="graphic">平面图形</button>
  <button class="mf" data-m="editorial">编辑排版</button>
  <button class="mf" data-m="emotional">情绪化</button>
  <button class="mf" data-m="horror">恐怖</button>
</div>
<div id="list"></div>
<div class="note">
<b>怎么读这张表</b>：<code>w</code> = 基础选中权重（默认 1）；<code>front/back</code> = 装饰层前后；<code>subtle</code> = 低调部件；<code>builtin</code> = 渲染器内建效果。<br>
在风格包里引用示例：<code>enter: { blurStagger: 1.8, glitch: 0.3 }</code> —— key 必须是本表第一列的关键词。
</div>

const GC = {"layout": "版面布局", "enter": "进入动画", "hold": "停留表现", "exit": "退出动画", "decor": "装饰元素", "treat": "文字处理", "bg": "背景图形", "cam": "运镜", "fx": "特效 / 转场", "trans": "镜头切换"};
const MC = {"glitch": "故障", "calm": "静谧", "pop": "流行", "graphic": "平面图形", "editorial": "编辑排版", "emotional": "情绪化", "horror": "恐怖"};
const GD = {"layout": "每句歌词的整体排版方式（按镜头抽取）", "enter": "文字进入画面的动效", "hold": "文字停留期间的动态", "exit": "文字离开画面的动效", "decor": "叠加在画面上的装饰图案", "treat": "文字本身的加工（描边、阴影、渐变…）", "bg": "整屏背景图形", "cam": "镜头运动", "fx": "后期效果 / 事件转场", "trans": "两个镜头之间的接管方式"};
let mood = '', q = '';
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render() {
  const groups = [...new Set(DATA.map(d => d.group))];
  let html = '';
  for (const g of groups) {
    const rows = DATA.filter(d => d.group === g).filter(d => {
      if (mood && !(d.tags||[]).includes(mood)) return false;
      if (q) {
        const s = (d.key + ' ' + d.cn + ' ' + d.name).toLowerCase();
        if (!s.includes(q)) return false;
      }
      return true;
    });
    if (!rows.length) continue;
    html += `<h2>${GC[g]||g}<span class="en">${g}</span><span class="cnt">${rows.length} 个</span></h2><p class="gd">${GD[g]||''}</p>`;
    html += '<table><tr><th>关键词 key</th><th>中文</th><th>日文原名</th><th>心情标签</th><th>w</th><th>备注</th></tr>';
    for (const d of rows) {
      const tags = (d.tags||[]).map(t => `<span class="tag">${MC[t]||t}</span>`).join('');
      const notes = [d.layer, d.subtle?'subtle':'', d.builtin?'builtin':'', d.pack!=='core'?d.pack:''].filter(Boolean).join(' · ');
      html += `<tr><td class="k">${esc(d.key)}</td><td>${esc(d.cn)}</td><td class="jp">${esc(d.name)}</td><td>${tags}</td><td class="w">${d.w}</td><td class="w">${notes}</td></tr>`;
    }
    html += '</table>';
  }
  document.getElementById('list').innerHTML = html || '<p class="gd">没有匹配的部件</p>';
}
document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
document.querySelectorAll('.mf').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.mf').forEach(x => x.classList.toggle('on', x === b));
  mood = b.dataset.m; render();
}));
render();
</script>
